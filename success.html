<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Success – PromptForge Daily</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo" id="brand-name">PromptForge Daily</a>
    </nav>
  </header>
  <main class="success">
    <h1>You're in.</h1>
    <p>Payment went through. Your digital product is ready.</p>
    <a href="#" id="download-link" class="cta">Download Product</a>
    <p class="note">In a full production setup this link is unique and sent to your email. For now it is a placeholder so you can see the flow.</p>
    <p style="margin-top:2rem;"><a href="store.html">Back to store</a></p>
  </main>
  <footer>
    <p>© 2026 <span id="footer-brand">PromptForge Daily</span></p>
  </footer>
  <script>
    document.getElementById('brand-name').textContent = CONFIG.brand.name;
    document.getElementById('footer-brand').textContent = CONFIG.brand.name;
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('product');
    document.getElementById('download-link').href = `https://example.com/downloads/${productId || 'sample'}.zip`;
  </script>
</body>
</html>
